<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mass Spec RPA Control</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #f4f4f5;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .log-box {
            height: 300px;
            overflow-y: auto;
            background: #18181b;
            color: #10b981;
            padding: 10px;
            font-family: monospace;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        input {
            width: 75%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Laboratory Command Terminal</h2>
        <div id="terminal" class="log-box"></div>
        <input type="text" id="commandInput" placeholder="e.g. Export the latest Methane run please.">
        <button onclick="sendCommand()">Send to Grok</button>
    </div>

    <script>
        const terminal = document.getElementById("terminal");
        let ws;

        function logToTerminal(text) {
            const div = document.createElement("div");
            div.textContent = "> " + text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function connect() {
            ws = new WebSocket("ws://localhost:8000/ws/client");
            ws.onopen = () => logToTerminal("Connected to Cloud Server.");
            ws.onmessage = (event) => logToTerminal(event.data);
            ws.onclose = () => {
                logToTerminal("Disconnected. Reconnecting in 3s...");
                setTimeout(connect, 3000);
            };
            ws.onerror = () => ws.close();
        }

        connect();

        function sendCommand() {
            const input = document.getElementById("commandInput");
            if (input.value.trim() !== "" && ws && ws.readyState === WebSocket.OPEN) {
                logToTerminal("You: " + input.value);
                ws.send(input.value);
                input.value = "";
            } else if (!ws || ws.readyState !== WebSocket.OPEN) {
                logToTerminal("Error: Not connected to server.");
            }
        }

        document.getElementById("commandInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendCommand();
        });
    </script>
</body>

</html>
